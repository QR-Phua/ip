plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'checkstyle'
}

checkstyle {
    toolVersion = '11.0.0'
    configFile = file('config/checkstyle/checkstyle.xml')                       // path to your checkstyle.xml
    configProperties = [ 'suppressionFile': file('config/checkstyle/suppressions.xml').absolutePath ]
    ignoreFailures = false    // set to true to only warn instead of failing the build
    showViolations = true
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.10.0'
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.10.0'
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"

        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true
        showStandardStreams = false
    }
}

application {
    // Correct fully-qualified main class name (package + class)
    mainClass.set("alphaone.AlphaOne")
}

shadowJar {
    archiveBaseName = "alphaone"
    archiveClassifier = null
    archiveFileName = "alphaone.jar"
}

run{
    standardInput = System.in
}
